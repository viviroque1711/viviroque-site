name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # "staging" = endereço de teste do GitHub Pages (noindex); "production" = domínio do site.
      SITE_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Checa duplicidade de dados estruturados no HTML gerado
        run: node scripts/ld-count.mjs
      - name: Checa que os robôs de busca e de IA entram em todo o site (só em produção)
        if: env.SITE_ENV == 'production'
        run: node scripts/check-robots.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
